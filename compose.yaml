services:
  backend:
    image: 236356tranthienhung/backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    image: 236356tranthienhung/frontend
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://api-236356.onrender.com/api/foods
    ports:
      - "4173:4173"
    depends_on:
      - backend
    restart: unless-stopped
